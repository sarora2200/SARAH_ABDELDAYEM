<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS Feed Preview | Sarah Abdeldayem</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #6d28d9;
      --secondary-color: #ec4899;
      --accent-color: #a7f3d0;
      --text-color: #2d2d2d;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --gradient: linear-gradient(90deg, #a7f3d0, #fbcfe8, #c4b5fd);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f9f9 0%, #fce7f3 50%, #f3e8ff 100%);
      color: var(--text-color);
      line-height: 1.6;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    header {
      background: var(--gradient);
      padding: 2.5rem;
      text-align: center;
      color: var(--text-color);
    }

    .header-content {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 1.5rem;
    }

    .rss-info {
      background: rgba(255, 255, 255, 0.7);
      padding: 1rem;
      border-radius: 12px;
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
    }

    .rss-url {
      background: #f3f4f6;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-family: monospace;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .copy-btn {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s;
    }

    .copy-btn:hover {
      background: #5b21b6;
      transform: translateY(-2px);
    }

    .controls {
      padding: 1.5rem 2rem;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .search-box {
      position: relative;
      flex-grow: 1;
      max-width: 300px;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.8rem;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      font-size: 0.95rem;
    }

    .search-box i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
    }

    .filter-options {
      display: flex;
      gap: 0.8rem;
    }

    .filter-btn {
      background: white;
      border: 1px solid #d1d5db;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }

    .feed-container {
      padding: 1.5rem 2rem;
      max-height: 600px;
      overflow-y: auto;
    }

    .post {
      background: white;
      border-radius: 15px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.3s;
      border-left: 4px solid var(--primary-color);
    }

    .post:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      gap: 1rem;
    }

    .post-title {
      font-size: 1.4rem;
      margin-bottom: 0.5rem;
      color: var(--text-color);
    }

    .post-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s;
    }

    .post-title a:hover {
      color: var(--primary-color);
    }

    .post-date {
      color: #6b7280;
      font-size: 0.9rem;
      white-space: nowrap;
      margin-top: 0.3rem;
    }

    .post-summary {
      color: #4b5563;
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .read-more {
      color: var(--primary-color);
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.3s;
    }

    .read-more:hover {
      color: var(--secondary-color);
      gap: 0.6rem;
    }

    .loading, .error, .empty {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
    }

    .loading i, .error i, .empty i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    .error {
      color: #ef4444;
    }

    .back-to-blog {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    .back-to-blog a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      padding: 0.8rem 1.5rem;
      border-radius: 25px;
      background: #f3f4f6;
      transition: all 0.3s;
    }

    .back-to-blog a:hover {
      background: var(--primary-color);
      color: white;
      transform: translateY(-2px);
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--primary-color);
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.5s;
      z-index: 1000;
    }

    .notification.show {
      transform: translateY(0);
      opacity: 1;
    }

    @media (max-width: 768px) {
      .container {
        border-radius: 15px;
      }

      header {
        padding: 1.8rem 1.5rem;
      }

      h1 {
        font-size: 2rem;
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }

      .search-box {
        max-width: 100%;
      }

      .filter-options {
        width: 100%;
        justify-content: center;
      }

      .post-header {
        flex-direction: column;
      }

      .post-date {
        align-self: flex-start;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .feed-container {
        padding: 1rem;
      }

      .rss-info {
        flex-direction: column;
        align-items: center;
      }

      .rss-url {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <h1><i class="fas fa-rss"></i> RSS Feed Preview</h1>
        <p class="subtitle">Stay updated with the latest posts from Sarah Abdeldayem's Blog</p>

        <div class="rss-info">
          <div class="rss-url">
            <i class="fas fa-link"></i>
            <span id="url-text">https://sarora2200.github.io/SARAH_ABDELDAYEM/feed.xml</span>
          </div>
          <button class="copy-btn" id="copy-btn">
            <i class="fas fa-copy"></i> Copy RSS URL
          </button>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Search posts...">
      </div>

      <div class="filter-options">
        <button class="filter-btn active" data-filter="all">
          <i class="fas fa-layer-group"></i> All
        </button>
        <button class="filter-btn" data-filter="recent">
          <i class="fas fa-clock"></i> Recent
        </button>
      </div>
    </div>

    <div class="feed-container" id="feed-container">
      <div class="loading" id="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading RSS feed...</p>
      </div>
    </div>

    <div class="back-to-blog">
      <a href="https://sarora2200.github.io/SARAH_ABDELDAYEM/blog.html">
        <i class="fas fa-arrow-left"></i> Back to Blog
      </a>
    </div>
  </div>

  <div class="notification" id="notification">
    <i class="fas fa-check-circle"></i>
    <span id="notification-text">RSS URL copied to clipboard!</span>
  </div>

  <script>
    const feedUrl = "https://sarora2200.github.io/SARAH_ABDELDAYEM/feed.xml";
    const feedContainer = document.getElementById('feed-container');
    const loadingElement = document.getElementById('loading');
    const searchInput = document.getElementById('search-input');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const copyButton = document.getElementById('copy-btn');
    const notification = document.getElementById('notification');

    let allPosts = [];

    // Format date
    function formatDate(dateString) {
      const options = { year: 'numeric', month: 'long', day: 'numeric' };
      return new Date(dateString).toLocaleDateString(undefined, options);
    }

    // Show notification
    function showNotification(message) {
      const notificationText = document.getElementById('notification-text');
      notificationText.textContent = message;
      notification.classList.add('show');

      setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    // Copy RSS URL to clipboard
    copyButton.addEventListener('click', () => {
      navigator.clipboard.writeText(feedUrl)
        .then(() => {
          showNotification('RSS URL copied to clipboard!');
        })
        .catch(err => {
          showNotification('Failed to copy URL');
          console.error('Error copying text: ', err);
        });
    });

    // Filter posts based on search and filter criteria
    function filterPosts() {
      const searchTerm = searchInput.value.toLowerCase();
      const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;

      let filteredPosts = allPosts;

      // Apply search filter
      if (searchTerm) {
        filteredPosts = filteredPosts.filter(post =>
          post.title.toLowerCase().includes(searchTerm) ||
          post.summary.toLowerCase().includes(searchTerm)
        );
      }

      // Apply time filter
      if (activeFilter === 'recent') {
        const twoWeeksAgo = new Date();
        twoWeeksAgo.setDate(twoWeeksAgo.getDate() - 14);

        filteredPosts = filteredPosts.filter(post => {
          const postDate = new Date(post.date);
          return postDate >= twoWeeksAgo;
        });
      }

      // Display filtered posts or empty state
      if (filteredPosts.length === 0) {
        feedContainer.innerHTML = `
          <div class="empty">
            <i class="fas fa-inbox"></i>
            <p>No posts found matching your criteria</p>
          </div>
        `;
      } else {
        renderPosts(filteredPosts);
      }
    }

    // Render posts to the container
    function renderPosts(posts) {
      const postsHTML = posts.map(post => `
        <div class="post">
          <div class="post-header">
            <div>
              <h2 class="post-title"><a href="${post.link}" target="_blank">${post.title}</a></h2>
            </div>
            <div class="post-date"><i class="far fa-calendar"></i> ${formatDate(post.date)}</div>
          </div>
          <div class="post-summary">${post.summary}</div>
          <div class="post-footer">
            <a href="${post.link}" class="read-more" target="_blank">
              Read full post <i class="fas fa-arrow-right"></i>
            </a>
          </div>
        </div>
      `).join('');

      feedContainer.innerHTML = postsHTML;
    }

    // Fetch and parse RSS feed
    fetch(feedUrl)
      .then(response => {
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        return response.text();
      })
      .then(str => {
        // Hide loading indicator
        loadingElement.style.display = 'none';

        // Parse XML
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(str, "text/xml");

        // Check if parsing resulted in an error
        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) {
          throw new Error('Error parsing RSS feed');
        }

        // Extract posts
        const items = xmlDoc.querySelectorAll("entry");

        if (items.length === 0) {
          feedContainer.innerHTML = `
            <div class="empty">
              <i class="fas fa-rss"></i>
              <p>No posts found in the RSS feed</p>
            </div>
          `;
          return;
        }

        // Process posts
        allPosts = Array.from(items).map(el => {
          const title = el.querySelector("title")?.textContent || "Untitled";
          const link = el.querySelector("link")?.getAttribute("href") || "#";
          const summary = el.querySelector("summary")?.textContent || "No summary available";
          const date = el.querySelector("published")?.textContent || el.querySelector("updated")?.textContent || "";

          return { title, link, summary, date };
        });

        // Initial render
        renderPosts(allPosts);
      })
      .catch(err => {
        console.error("Error loading RSS feed:", err);
        loadingElement.style.display = 'none';
        feedContainer.innerHTML = `
          <div class="error">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Error loading RSS feed. Please try again later.</p>
            <p><small>${err.message}</small></p>
          </div>
        `;
      });

    // Add event listeners for search and filter
    searchInput.addEventListener('input', filterPosts);

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        filterPosts();
      });
    });
  </script>
</body>
</html>
