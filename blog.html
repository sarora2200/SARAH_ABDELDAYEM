---
layout: default
title: Blog
---

<div class="blog-container">
  <h1>📝 Blog</h1>

  <!-- Blog Posts -->
  <div class="post-grid">
    {% for post in site.posts %}
      <div class="post-card">
        {% if post.image %}
          <a href="{{ post.url | relative_url }}" target="_blank" rel="nofollow">
            <img src="{{ '/assests/images/' | append: post.image | relative_url }}" alt="{{ post.title }}" class="thumbnail">
          </a>
        {% endif %}
        <div class="post-info">
          <a href="{{ post.url | relative_url }}" class="post-title" target="_blank" rel="nofollow">{{ post.title }}</a>
          <p class="post-meta">
            {{ post.date | date: "%B %d, %Y" }} • By {{ post.author }}
          </p>
          <p class="post-excerpt">
            {{ post.excerpt | strip_html | truncate: 140 }}
          </p>
          <a href="{{ post.url | relative_url }}" class="read-more" target="_blank" rel="nofollow">Read More →</a>
        </div>
      </div>
    {% endfor %}
  </div>
</div>

<style>
  .blog-container {
    max-width: 1100px;
    margin: 2rem auto;
    padding: 2rem;
    background: #ffffffdd;
    border-radius: 18px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
  }

  .blog-container h1 {
    text-align: center;
    font-size: 2.7rem;
    color: #6d28d9;
    margin-bottom: 2rem;
  }

  /* Post Grid */
  .post-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.8rem;
  }

  .post-card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    transition: transform 0.25s, box-shadow 0.25s;
    display: flex;
    flex-direction: column;
  }
  .post-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 10px 24px rgba(0,0,0,0.12);
  }

  .thumbnail {
    width: 100%;
    height: 200px;
    object-fit: cover;
    transition: transform 0.3s;
  }
  .post-card:hover .thumbnail {
    transform: scale(1.03);
  }

  .post-info {
    padding: 1rem 1.2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .post-title {
    font-size: 1.4rem;
    font-weight: 600;
    color: #2d2d2d;
    text-decoration: none;
    margin-bottom: 0.4rem;
    line-height: 1.3;
  }
  .post-title:hover {
    color: #ec4899;
  }

  .post-meta {
    font-size: 0.9rem;
    color: #6d28d9;
    margin-bottom: 0.8rem;
  }

  .post-excerpt {
    flex: 1;
    font-size: 0.95rem;
    color: #444;
    margin-bottom: 0.8rem;
  }

  .read-more {
    align-self: flex-start;
    color: #7D4E85;
    font-weight: 600;
    text-decoration: none;
    transition: color 0.2s;
  }
  .read-more:hover {
    color: #c45dbc;
  }
</style>
