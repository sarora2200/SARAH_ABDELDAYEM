<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Sarah Abdeldayem - Explore and purchase professional Excel, Power BI, and Tableau dashboards.">
    <meta name="keywords"
        content="Excel Dashboard, Power BI Dashboard, Tableau Dashboard, Data Analytics, Digital Products">
    <meta name="author" content="Sarah Abdeldayem">

    <!-- Favicons -->
    <link rel="icon" href="images/logo00.png" type="image/png">
    <link rel="apple-touch-icon" href="images/logo00.png" sizes="180x180">

    <!-- Styles & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <title>Shop | Sarah Abdeldayem</title>

    <style>
        /* Optional: Consistent button styling */
        .buy-button {
            display: inline-block;
            background: #0070ba;
            color: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.3s;
        }

        .buy-button:hover {
            background: #005c99;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .product-card {
            max-width: 280px;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            background: #fff;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            max-width: 100%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Sarah Abdeldayem Logo" width="120" height="auto">
        </a>
        <nav class="navigation">
            <a href="index.html">⬅ Back to Home</a>
        </nav>
    </header>

    <main>
        <section class="shop-section">
            <h2>Digital Dashboards</h2>
            <div class="products">

                <!-- Excel Dashboard -->
                <div class="product-card">
                    <img src="images/excel-dashboard.png" alt="Excel Sales Dashboard Preview" loading="lazy">
                    <h3>Excel Sales Dashboard</h3>
                    <p>$25.00</p>
                    <a href="https://payhip.com/b/yourExcelLink" class="buy-button" target="_blank" rel="noopener">Buy
                        Now</a>
                </div>

                <!-- Power BI Dashboard -->
                <div class="product-card">
                    <img src="images/DrugSales.png" alt="Power BI Dashboard Template Preview" loading="lazy">
                    <h3>Power BI Dashboard Template</h3>
                    <p>$15.00</p>
                    <a href="https://payhip.com/b/485XF" class="buy-button" target="_blank" rel="noopener">Buy Now </a>
                </div>

            </div>
        </section>
    </main>

</body>

</html>
