<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f0f9f9, #fce7f3, #f3e8ff);
      color: #2d2d2d;
      line-height: 1.7;
    }

    header {
      background: linear-gradient(90deg, #a7f3d0, #fbcfe8, #c4b5fd);
      color: #2d2d2d;
      padding: 1rem 2rem;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header a {
      color: #2d2d2d;
      text-decoration: none;
      font-weight: bold;
      margin: 0 0.5rem;
    }

    header a:hover {
      color: #6d28d9;
    }

    .post-container {
      max-width: 850px;
      margin: 2rem auto;
      padding: 2rem;
      background: #ffffffdd;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #6d28d9;
    }

    .post-banner {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 2rem;
      text-decoration: none;
      font-weight: bold;
      color: #6d28d9;
    }

    .back-home:hover {
      color: #ec4899;
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}">🏠 Home</a> |
    <a href="{{ '/blog.html' | relative_url }}">📝 Blog</a>
  </header>

  <div class="post-container">
    <h1>{{ page.title }}</h1>

    {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="post-banner">
    {% endif %}

    {{ content }}

    <a href="{{ '/blog.html' | relative_url }}" class="back-home">⬅ Back to Blog</a>
  </div>
</body>
</html>
