<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f0f9f9, #fce7f3, #f3e8ff);
      color: #2d2d2d;
      line-height: 1.7;
    }

    header {
      background: linear-gradient(90deg, #a7f3d0, #fbcfe8, #c4b5fd);
      color: #2d2d2d;
      padding: 1rem 2rem;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header a {
      color: #2d2d2d;
      text-decoration: none;
      font-weight: bold;
      margin: 0 0.5rem;
    }

    header a:hover {
      color: #6d28d9;
    }

    /* Category Filter */
    .category-filter {
      text-align: center;
      margin: 1.5rem 0;
    }
    .filter-btn {
      display: inline-block;
      margin: 0 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: #f3f4f6;
      color: #374151;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: #6d28d9;
      color: #fff;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .blog-container {
      background: #ffffffdd;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
      padding: 2rem;
    }

    h1 {
      text-align: center;
      font-size: 2.7rem;
      color: #6d28d9;
      margin-bottom: 2rem;
    }

    /* Post Grid */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.8rem;
    }

    .post-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      transition: transform 0.25s, box-shadow 0.25s;
      display: flex;
      flex-direction: column;
    }
    .post-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
    }

    .thumbnail {
      width: 100%;
      height: 200px;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .post-card:hover .thumbnail {
      transform: scale(1.03);
    }

    .post-info {
      padding: 1rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .post-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #2d2d2d;
      text-decoration: none;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }
    .post-title:hover {
      color: #ec4899;
    }

    .post-meta {
      font-size: 0.9rem;
      color: #6d28d9;
      margin-bottom: 0.8rem;
    }

    .post-excerpt {
      flex: 1;
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 0.8rem;
    }

    .read-more {
      align-self: flex-start;
      color: #7D4E85;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .read-more:hover {
      color: #c45dbc;
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}" target="_blank">🏠 Home</a> |
    <a href="{{ '/blog.html' | relative_url }}" target="_blank">📝 Blog</a>
  </header>

  <!-- Category Filter -->
  <div class="category-filter">
    <a class="filter-btn" href="{{ '/blog.html' | relative_url }}">All</a>
    {% assign categories = site.categories | sort %}
    {% for category in categories %}
      <a class="filter-btn" href="{{ '/categories/' | append: category[0] | relative_url }}">
        {{ category[0] | capitalize }}
      </a>
    {% endfor %}
  </div>

  <main>
    <div class="blog-container">
      {{ content | replace: '<a ', '<a target="_blank" rel="nofollow" ' }}
    </div>
  </main>
</body>
</html>
