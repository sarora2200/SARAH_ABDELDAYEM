<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: 'Explore insights on healthcare analytics, bioinformatics, and data science from Sarah Abdeldayem.' }}">

  <!-- SEO & Social Media Meta Tags -->
  <meta property="og:title" content="{{ page.title }} | {{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: 'Explore insights on healthcare analytics, bioinformatics, and data science from Sarah Abdeldayem.' }}">
  <meta property="og:image" content="{{ site.url }}/images/{{ page.image | default: 'default-social.jpg' }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@yourtwitterhandle">

  <!-- Favicon (optimized version) -->
  <link rel="icon" href="{{ '/images/logo00.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/images/logo00.png' | relative_url }}">
  <link rel="mask-icon" href="{{ '/images/logo00.png' | relative_url }}" color="#6d28d9">

  <!-- Preload critical resources -->
  <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="{{ '/style.css' | relative_url }}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </noscript>

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{ page.title }}",
    "description": "{{ page.description }}",
    "author": {
      "@type": "Person",
      "name": "Sarah Abdeldayem"
    },
    "datePublished": "{{ page.date | date: '%Y-%m-%d' }}",
    "image": "{{ site.url }}/images/{{ page.image }}"
  }
  
  </script>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f0f9f9, #fce7f3, #f3e8ff);
      color: #2d2d2d;
      line-height: 1.7;
    }

    header {
      background: linear-gradient(90deg, #a7f3d0, #fbcfe8, #c4b5fd);
      color: #2d2d2d;
      padding: 1rem 2rem;
      text-align: center;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header a {
      color: #2d2d2d;
      text-decoration: none;
      font-weight: bold;
      margin: 0 0.5rem;
    }

    header a:hover {
      color: #6d28d9;
    }

    .post-container {
      max-width: 850px;
      margin: 2rem auto;
      padding: 2rem;
      background: #ffffffdd;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #6d28d9;
    }

    .post-banner {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 2rem;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 2rem;
      text-decoration: none;
      font-weight: bold;
      color: #6d28d9;
    }

    .back-home:hover {
      color: #ec4899;
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ '/' | relative_url }}" target="_blank">🏠 Home</a> |
    <a href="{{ '/blog.html' | relative_url }}" target="_blank">📝 Blog</a>
  </header>

  <div class="post-container">
    <h1>{{ page.title }}</h1>

    {% if page.image %}
      <img src="{{ '/assests/images/' | append: page.image | relative_url }}" alt="{{ page.title }}" class="post-banner">
    {% endif %}

    <div class="post-content">
      {{ content | replace: '<a ', '<a target="_blank" rel="nofollow" ' }}
    </div>

    <a href="{{ '/blog.html' | relative_url }}" class="back-home" target="_blank">⬅ Back to Blog</a>
  </div>
</body>
</html>
